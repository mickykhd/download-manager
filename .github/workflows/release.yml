name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg binaries (GLFW/GLEW)
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-x64-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            vcpkg-x64-windows-

      - name: Install GUI deps via preinstalled vcpkg
        shell: pwsh
        run: C:/vcpkg/vcpkg.exe install glfw3 glew --triplet x64-windows

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -DCDM_BUILD_GUI=ON -DCDM_FETCH_CURL=ON
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (ZIP + NSIS)
        shell: pwsh
        run: cpack --config build/CPackConfig.cmake -C Release

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem cdm-download-manager-*.zip, cdm-download-manager-*.exe |
            ForEach-Object {
              (Get-FileHash $_.FullName -Algorithm SHA256).Hash +
              "  " + $_.Name | Out-File -Append SHA256SUMS.txt -Encoding ascii
            }
          Get-Content SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            cdm-download-manager-*.zip
            cdm-download-manager-*.exe
            SHA256SUMS.txt

  release:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/cdm-download-manager-*.zip
            release/cdm-download-manager-*.exe
            release/SHA256SUMS.txt
          body: |
            Windows x64 build: CLI (`cdm.exe`) + GUI (`cdm-gui.exe`).
            See CHANGELOG.md for what changed.

      # Auto-opens a winget-pkgs PR on every release.
      # Requires a WINGET_TOKEN secret (PAT with public_repo scope on a
      # fork of microsoft/winget-pkgs); skipped when not configured.
      - uses: vedantmgoyal9/winget-releaser@v2
        if: ${{ secrets.WINGET_TOKEN != '' }}
        with:
          identifier: mickykhd.CdmDownloadManager
          version: ${{ github.ref_name }}
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
